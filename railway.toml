# railway.toml — Cấu hình deploy Railway (auto-detect Dockerfile, thêm healthcheck).
# Docs: https://docs.railway.com/reference/config-as-code
[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Sau deploy, vào Settings → Volumes: mount /data (profile Chrome persistent).
# Sau deploy, vào Variables: set PROXY (residential) nếu muốn auto-pass captcha.
